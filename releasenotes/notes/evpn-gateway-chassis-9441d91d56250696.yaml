---
features:
  - |
    A new ``ovn-cms-options`` value, ``enable-chassis-as-evpn-gw``, selects
    the chassis that can host the ports of EVPN routers (routers created with
    ``evpn_vni``). An EVPN router port needs the EVPN pieces on the chassis it
    is bound to: the OVN agent with the ``ovn-evpn`` extension and a BGP
    speaker. When at least one chassis sets this option, the EVPN scheduler
    only considers these chassis (still least loaded first and within the
    router's availability zone hints), and the EVPN database synchronization
    only uses them when it repairs a router. When no chassis sets it, every
    gateway chassis (``enable-chassis-as-gw``) is a candidate, as before.
